# yaml-language-server: $schema=https://codemagic.io/codemagic-schema.json
# VFX Pro Android CI. Debug APK builds on the default Mac machine so a
# personal Codemagic account can start a build without Linux billing.
# linux_x2 / linux_x4 are rejected in the YAML editor unless billing is on.
# Do not reference an environment group that is not created in the Codemagic UI.

workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    environment:
      java: 21
      vars:
        PACKAGE_NAME: com.aistudio.vfxpro.rkmw
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Create debug keystore
        script: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build debug APK
        script: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/**/*.apk
