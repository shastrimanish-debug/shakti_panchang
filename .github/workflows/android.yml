name: Android CI/CD & GitHub Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag name (e.g. v1.0.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Xmx4g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup environment
        run: |
          echo 'GEMINI_API_KEY="AIzaSyPlaceholderKeyForBuild"' > .env.example
          echo 'GEMINI_API_KEY="AIzaSyPlaceholderKeyForBuild"' > .env
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"123456789012","project_id":"vfxpro-app","storage_bucket":"vfxpro-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567890","android_client_info":{"package_name":"com.aistudio.vfxpro.rkmw"}},"oauth_client":[],"api_key":[{"current_key":"fake_api_key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Setup debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Make Gradle Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Assemble APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Rename and Prepare APK for Release
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk release-assets/VFXPro-v1.0-debug.apk
          echo "Release APK prepared at release-assets/VFXPro-v1.0-debug.apk"
          ls -la release-assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: VFXPro-Debug-APK
          path: release-assets/VFXPro-v1.0-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/(v.+) ]]; then
            TAG_NAME="${BASH_REMATCH[1]}"
          else
            TAG_NAME="v1.0-build-${{ github.run_number }}"
          fi

          echo "Publishing release with tag: $TAG_NAME"

          # Create release or upload to existing release
          gh release create "$TAG_NAME" release-assets/*.apk \
            --target "${{ github.sha }}" \
            --title "VFX Pro Release $TAG_NAME" \
            --notes "### 🚀 VFX Pro Android Release ($TAG_NAME)
          
          Automatically built by GitHub Actions CI/CD.
          
          #### What's Included:
          - **APK Direct Download**: \`VFXPro-v1.0-debug.apk\`
          - **Features**: InShot / CapCut Multi-Track Layers, 25+ VFX Shaders, Advanced Typography Fonts & Viral Presets.
          
          #### Installation:
          1. Download \`VFXPro-v1.0-debug.apk\` below onto your Android device.
          2. Open the file and allow *Install from unknown sources* if prompted.
          3. Launch **VFX Pro** and enjoy video editing!" \
            --generate-notes || gh release upload "$TAG_NAME" release-assets/*.apk --clobber

