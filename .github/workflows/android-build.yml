name: Android Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Node Dependencies & Build Web App
      run: |
        npm install
        npm run build || true

    - name: Generate Gradle Wrapper and Build Android App
      run: |
        gradle wrapper --gradle-version 8.5 || true
        chmod +x gradlew 2>/dev/null || true
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Find and Verify APK
      run: |
        find . -name "*.apk" -ls

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shakti-panchang-v1.0.8-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
          *.apk
        if-no-files-found: warn

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
          *.apk
        tag_name: v1.0.8-release
        name: Shakti Panchang v1.0.8 Release
        body: "Automatic Release for Shakti Panchang v1.0.8 APK containing full Vedic Panchang, Horoscope, and Jetpack Compose screens."
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
