name: Android Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Node Dependencies & Build Web App
      run: |
        npm install
        npm run build || true

    - name: Build Android App (Gradle)
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Find and Verify APK
      run: |
        find . -name "*.apk" -ls

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shakti-panchang-v1.0.9-apk
        path: |
          **/build/outputs/apk/debug/*.apk
          *.apk
        if-no-files-found: warn

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: |
          **/build/outputs/apk/debug/*.apk
          *.apk
        tag_name: v1.0.9-release
        name: Shakti Panchang v1.0.9 Release (Complete Vedic Edition with Vastu & Upay)
        body: "Automatic Release for Shakti Panchang v1.0.9 APK containing Full Vedic Panchang, Durga Saptashati Book Reader with Index, Vastu Shastra Guide, Miraculous Upay for Debt/Career/Education, and 40-Year Experienced Master Astrologer Uma AI."
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
