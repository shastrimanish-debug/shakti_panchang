name: Build Android APK & AAB and Publish Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build web
        run: |
          npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
          fi

      - name: Build Android App Bundle (AAB) & APK
        run: |
          if [ -d "android" ]; then
            cd android
            ./gradlew bundleRelease assembleRelease
          fi

      - name: Create GitHub Release & Upload APK/AAB Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "Shakti Panchang v1.0.8 (Play Store Ready)"
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
