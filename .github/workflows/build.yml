name: Build Web App and Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: 🌐 Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 required by Capacitor 8+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Type Check & Lint
        run: npm run lint

      - name: ⚡ Build Web Assets
        run: npm run build

      - name: 📤 Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shakti-Panchang-Web-Dist
          path: dist/
          retention-days: 30

  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 required by Capacitor 8+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚡ Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🔨 Build Android Release Bundle (AAB), Release APK & Debug APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease assembleDebug --no-daemon --stacktrace

      - name: 📋 Prepare Android Artifacts
        run: |
          mkdir -p release-artifacts
          # Google Play Store App Bundle (AAB)
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab release-artifacts/Shakti-Panchang-PlayStore-Release.aab
          fi
          # Signed Release APK for direct install
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-artifacts/Shakti-Panchang-Signed-Release.apk
          fi
          # Debug APK
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/Shakti-Panchang-Debug.apk
          fi
          echo "Generated Android artifacts:"
          ls -lh release-artifacts/

      - name: 📤 Upload Android Artifacts (AAB & APKs)
        uses: actions/upload-artifact@v4
        with:
          name: Shakti-Panchang-Android-Binaries
          path: release-artifacts/*
          retention-days: 30

      - name: 🚀 Release on GitHub (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
