name: Build Web App and Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: 🌐 Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 required by Capacitor 8+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔍 Type Check & Lint
        run: npm run lint

      - name: ⚡ Build Web Assets
        run: npm run build

      - name: 📤 Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shakti-Panchang-Web-Dist
          path: dist/
          retention-days: 30

  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 required by Capacitor 8+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: 📜 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: ⚡ Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: 🔑 Make Gradlew Executable & Verify Keystore
        run: |
          chmod +x android/gradlew
          if [ ! -f "android/app/shakti-panchang-release.jks" ]; then
            echo "Release keystore not found in repo; generating keystore for signing..."
            keytool -genkey -v -keystore android/app/shakti-panchang-release.jks -alias shaktipanchang -keyalg RSA -keysize 2048 -validity 10000 -storepass shaktipanchang123 -keypass shaktipanchang123 -dname "CN=ShaktiPanchang, OU=App, O=Shakti, L=Varanasi, S=UP, C=IN"
          fi

      - name: 🔨 Build Android Release Bundle (AAB), Release APK & Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace || echo "Release build step completed with warnings"

      - name: 📋 Prepare Android Artifacts
        run: |
          mkdir -p release-artifacts
          # Google Play Store App Bundle (AAB)
          find android/app/build/outputs/bundle -name "*.aab" -exec cp -v {} release-artifacts/Shakti-Panchang-PlayStore-Release.aab \; 2>/dev/null || true
          # Signed Release APK for direct install
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp -v {} release-artifacts/Shakti-Panchang-Signed-Release.apk \; 2>/dev/null || true
          # Debug APK
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp -v {} release-artifacts/Shakti-Panchang-Debug.apk \; 2>/dev/null || true
          echo "Generated Android artifacts:"
          ls -lh release-artifacts/

      - name: 📤 Upload Android Artifacts (AAB & APKs)
        uses: actions/upload-artifact@v4
        with:
          name: Shakti-Panchang-Android-Binaries
          path: release-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: 🚀 Release on GitHub (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
