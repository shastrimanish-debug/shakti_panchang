name: Build Web App and Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web:
    name: 🌐 Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-android:
    name: 📱 Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Download Web Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Restore release keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          python3 - << 'PY'
          import base64, os, pathlib, sys
          raw = os.environ.get("KEYSTORE_FILE", "").strip()
          if not raw:
              sys.exit("KEYSTORE_FILE secret is empty. The release APK would be unsigned and Android would reject it.")
          if "base64," in raw:
              raw = raw.split("base64,", 1)[1]
          raw = "".join(raw.split()).replace("-", "+").replace("_", "/")
          pad = (-len(raw)) % 4
          raw = raw + ("=" * pad)
          try:
              data = base64.b64decode(raw, validate=False)
          except Exception as exc:
              sys.exit(f"KEYSTORE_FILE is not valid base64: {exc}")
          if len(data) < 16:
              sys.exit(f"Decoded keystore is too small ({len(data)} bytes). KEYSTORE_FILE must be the base64 of the .jks/.p12 file.")
          out = pathlib.Path("android/app/shakti-panchang-release.jks")
          out.write_bytes(data)
          print(f"Wrote {out} ({len(data)} bytes), magic={data[:4].hex()}")
          PY

      - name: Check keystore password and alias
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          PASS="${STORE_PASSWORD:-shaktipanchang123}"
          if ! keytool -list -keystore android/app/shakti-panchang-release.jks -storepass "$PASS"; then
            echo "Auto-detect failed. Trying PKCS12, then JKS."
            keytool -list -storetype PKCS12 -keystore android/app/shakti-panchang-release.jks -storepass "$PASS" \
              || keytool -list -storetype JKS -keystore android/app/shakti-panchang-release.jks -storepass "$PASS"
          fi
          echo "Expected alias: ${KEY_ALIAS:-shaktipanchang}"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build signed release APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          echo "---- outputs ----"
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -printf '%s %p\n'

      - name: Verify signature and publish only the signed files
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "Signed release APK was not produced. Refusing to upload an uninstallable package."
            find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \)
            exit 1
          fi
          unsigned=$(find android/app/build/outputs -name '*unsigned*.apk' || true)
          if [ -n "$unsigned" ]; then
            echo "Unsigned APK is still present; signing config was not applied."
            echo "$unsigned"
            exit 1
          fi
          APKSIGNER=$(find /usr/local/lib/android /opt "$HOME" /usr/lib/android-sdk -name apksigner -type f 2>/dev/null | sort | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p release-out
          cp "$APK" release-out/Shakti-Panchang-v1.0.10.apk
          cp "$AAB" release-out/Shakti-Panchang-v1.0.10.aab
          ls -la release-out

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Shakti-Panchang-v1.0.10
          path: release-out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10
          name: Shakti Panchang v1.0.10
          overwrite_files: true
          target_commitish: ${{ github.sha }}
          files: release-out/*
          fail_on_unmatched_files: true
          body: |
            Install **Shakti-Panchang-v1.0.10.apk** only.

            The previous `app-release-unsigned.apk` had no signature, so Android showed "App not installed as package appears to be invalid."

            This build is signed with the release key (v1 + v2). If an older copy of the app is already installed and update is blocked, uninstall that copy once, then install this APK.

            Do not install the `.aab` file on a phone. The AAB is only for Google Play.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
