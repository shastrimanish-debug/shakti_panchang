name: Build Web App and Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web:
    name: 🌐 Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-android:
    name: 📱 Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Download Web Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Restore release keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          python3 - << 'PY'
          import base64, os, pathlib, sys

          def sh_quote(value: str) -> str:
              return "'" + value.replace("'", "'\\''") + "'"

          def looks_like_keystore(data: bytes) -> bool:
              if len(data) < 32:
                  return False
              if data[:4] in (b"\xfe\xed\xfe\xed", b"\xce\xce\xce\xce"):
                  return True
              return data[0] == 0x30

          raw = os.environ.get("KEYSTORE_FILE", "")
          print(f"KEYSTORE_FILE length={len(raw)} null={chr(0) in raw}")
          other = sorted({c for c in raw if c not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=-_ \n\r\t"})
          print("non-base64-codepoints", [hex(ord(c)) for c in other[:12]], "count", len(other))

          candidates = []
          raw_bytes = raw.encode("latin-1", errors="ignore")
          candidates.append(raw_bytes)
          if raw.strip().startswith("{"):
              try:
                  import json
                  obj = json.loads(raw)
                  if isinstance(obj, dict):
                      for value in obj.values():
                          if isinstance(value, str):
                              candidates.append(value.encode("utf-8"))
              except Exception as exc:
                  print("json parse skipped", exc)

          filtered = "".join(ch for ch in raw if ch in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=-_")
          filtered = filtered.replace("-", "+").replace("_", "/")
          if filtered:
              filtered += "=" * ((-len(filtered)) % 4)
              try:
                  once = base64.b64decode(filtered, validate=False)
                  candidates.append(once)
                  try:
                      twice_src = once.decode("ascii")
                      twice_src = "".join(ch for ch in twice_src if ch in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=-_")
                      twice_src = twice_src.replace("-", "+").replace("_", "/")
                      twice_src += "=" * ((-len(twice_src)) % 4)
                      candidates.append(base64.b64decode(twice_src, validate=False))
                  except Exception:
                      pass
              except Exception as exc:
                  print("base64 decode failed", exc)
          if all(c in "0123456789abcdefABCDEF \n\r\t" for c in raw.strip()) and raw.strip():
              try:
                  candidates.append(bytes.fromhex("".join(raw.split())))
              except Exception as exc:
                  print("hex decode failed", exc)

          chosen = None
          for item in candidates:
              magic = item[:4].hex() if item else ""
              print(f"candidate bytes={len(item)} magic={magic}")
              if looks_like_keystore(item):
                  chosen = item
                  break

          out = pathlib.Path("android/app/shakti-panchang-release.jks")
          if chosen is not None:
              out.write_bytes(chosen)
              print(f"Wrote secret keystore {out} ({len(chosen)} bytes)")
          elif out.exists() and looks_like_keystore(out.read_bytes()):
              print(f"KEYSTORE_FILE secret is not a keystore. Using committed {out} ({out.stat().st_size} bytes)")
          else:
              print("No usable keystore yet. The next step will generate one.")
              if out.exists():
                  out.unlink()

          store = (os.environ.get("STORE_PASSWORD") or "").strip() or "shaktipanchang123"
          key = (os.environ.get("KEY_PASSWORD") or "").strip() or store
          alias = (os.environ.get("KEY_ALIAS") or "").strip() or "shaktipanchang"
          pathlib.Path("android/signing.env").write_text(
              "STORE_PASSWORD=" + sh_quote(store) + "\n"
              + "KEY_PASSWORD=" + sh_quote(key) + "\n"
              + "KEY_ALIAS=" + sh_quote(alias) + "\n"
          )
          print(f"signing env alias set, store password length={len(store)}")
          PY

      - name: Check keystore password and alias
        run: |
          set -a
          source android/signing.env
          set +a
          try_list() {
            local pass="$1"
            keytool -list -keystore android/app/shakti-panchang-release.jks -storepass "$pass" && return 0
            keytool -list -storetype PKCS12 -keystore android/app/shakti-panchang-release.jks -storepass "$pass" && return 0
            keytool -list -storetype JKS -keystore android/app/shakti-panchang-release.jks -storepass "$pass" && return 0
            return 1
          }
          if [ -f android/app/shakti-panchang-release.jks ] && try_list "$STORE_PASSWORD"; then
            echo "Release keystore opens. Alias: $KEY_ALIAS"
          elif [ -f android/app/shakti-panchang-release.jks ] && try_list "shaktipanchang123"; then
            echo "Release keystore opens with the documented password."
            python3 - << 'PY'
          from pathlib import Path
          Path("android/signing.env").write_text(
              "STORE_PASSWORD='shaktipanchang123'\n"
              "KEY_PASSWORD='shaktipanchang123'\n"
              "KEY_ALIAS='shaktipanchang'\n"
          )
          PY
          else
            echo "Stored keystore could not be used. Generating a new release keystore so the APK is signed and can be installed."
            rm -f android/app/shakti-panchang-release.jks
            keytool -genkeypair \
              -keystore android/app/shakti-panchang-release.jks \
              -storetype PKCS12 \
              -alias shaktipanchang \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass shaktipanchang123 -keypass shaktipanchang123 \
              -dname "CN=ShaktiPanchang, OU=App, O=ShaktiPanchang, C=IN"
            python3 - << 'PY'
          from pathlib import Path
          Path("android/signing.env").write_text(
              "STORE_PASSWORD='shaktipanchang123'\n"
              "KEY_PASSWORD='shaktipanchang123'\n"
              "KEY_ALIAS='shaktipanchang'\n"
          )
          PY
            keytool -list -keystore android/app/shakti-panchang-release.jks -storepass shaktipanchang123
          fi
          set -a
          source android/signing.env
          set +a
          FOUND=$(keytool -list -keystore android/app/shakti-panchang-release.jks -storepass "$STORE_PASSWORD" | sed -n 's/^[[:space:]]*\([^,]*\),.*PrivateKeyEntry.*/\1/p' | head -1)
          if [ -n "$FOUND" ]; then
            echo "Signing alias from keystore: $FOUND"
            KEY_ALIAS="$FOUND" python3 - << 'PY'
          import os
          from pathlib import Path
          def q(v):
              return "'" + v.replace("'", "'\\''") + "'"
          Path("android/signing.env").write_text(
              "STORE_PASSWORD=" + q(os.environ["STORE_PASSWORD"]) + "\n"
              + "KEY_PASSWORD=" + q(os.environ.get("KEY_PASSWORD") or os.environ["STORE_PASSWORD"]) + "\n"
              + "KEY_ALIAS=" + q(os.environ["KEY_ALIAS"]) + "\n"
          )
          PY
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build signed release APK and AAB
        run: |
          set -a
          source android/signing.env
          set +a
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          echo "---- outputs ----"
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -printf '%s %p\n'

      - name: Verify signature and publish only the signed files
        run: |
          set -euo pipefail
          set -a
          source android/signing.env
          set +a
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "Signed release APK was not produced. Refusing to upload an uninstallable package."
            find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \)
            exit 1
          fi
          unsigned=$(find android/app/build/outputs -name '*unsigned*.apk' || true)
          if [ -n "$unsigned" ]; then
            echo "Unsigned APK is still present; signing config was not applied."
            echo "$unsigned"
            exit 1
          fi
          APKSIGNER=$(find /usr/local/lib/android /opt "$HOME" /usr/lib/android-sdk -name apksigner -type f 2>/dev/null | sort | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi
          echo "Using $APKSIGNER"
          mkdir -p release-out
          # Gradle left v2 only. Some phones report that as an invalid package unless v1 is present too.
          "$APKSIGNER" sign \
            --ks android/app/shakti-panchang-release.jks \
            --ks-pass "pass:${STORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out release-out/Shakti-Panchang-v1.0.10.apk \
            "$APK"
          "$APKSIGNER" verify --verbose --print-certs release-out/Shakti-Panchang-v1.0.10.apk
          cp "$AAB" release-out/Shakti-Panchang-v1.0.10.aab
          rm -f release-out/*.idsig
          ls -la release-out

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Shakti-Panchang-v1.0.10
          path: release-out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10
          name: Shakti Panchang v1.0.10
          overwrite_files: true
          target_commitish: ${{ github.sha }}
          files: release-out/*
          fail_on_unmatched_files: true
          body: |
            Install **Shakti-Panchang-v1.0.10.apk** only.

            The previous `app-release-unsigned.apk` had no signature, so Android showed "App not installed as package appears to be invalid."

            This build is signed with the release key (v1 + v2). If an older copy of the app is already installed and update is blocked, uninstall that copy once, then install this APK.

            Do not install the `.aab` file on a phone. The AAB is only for Google Play.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
